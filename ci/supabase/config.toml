# Throwaway local Supabase used ONLY by CI (and by you, locally, to reproduce CI):
#   npx supabase@3.2.0 start --workdir ci
# It never talks to a hosted project. Our own runner (npm run migrate) applies
# supabase/migrations; the CLI's own migrations and seed are switched off here.
# Unlisted settings keep the CLI defaults.
project_id = "nizamo-ci"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
# Not used by the app (NextAuth signs our own JWTs), but the API gateway expects it.
enabled = true
