# CI: runs on every push and pull request to main. See docs/CI.md.
# Uses NO repository secrets: it cannot reach the dev (or any hosted) database. The database job
# starts a throwaway local Supabase inside the runner and destroys it with the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  FORCE_COLOR: '0'

jobs:
  checks:
    name: Lint, unit tests, PDF, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so the build can start. Not secrets and not a real project:
      # nothing in the build talks to a database.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret-at-least-32-characters
      NEXTAUTH_SECRET: ci-placeholder-nextauth-secret
      NEXT_PUBLIC_ROOT_DOMAIN: ''
      NEXT_PUBLIC_SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:pdf
      - run: npm run build

  database:
    name: Migrations + tenant isolation (throwaway Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start local Supabase (CLI defaults; ci/supabase/config.toml)
        run: npx --yes supabase@3.2.0 start --workdir ci

      - name: Export local connection details (local-only demo keys, masked anyway)
        run: |
          npx --yes supabase@3.2.0 status --workdir ci -o env > "$RUNNER_TEMP/sb.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/sb.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          for v in "$(get ANON_KEY)" "$(get SERVICE_ROLE_KEY)" "$(get JWT_SECRET)"; do echo "::add-mask::$v"; done
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
            echo "SUPABASE_JWT_SECRET=$(get JWT_SECRET)"
            echo "DATABASE_URL=$(get DB_URL)"
            echo "TEST_DATABASE_URL=$(get DB_URL)"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/sb.env"

      - name: Apply all migrations to the empty database
        run: npm run migrate

      - name: Second run applies nothing
        run: npm run migrate | tee "$RUNNER_TEMP/m2.txt" && grep -q "Nothing to apply" "$RUNNER_TEMP/m2.txt"

      - name: Migration status is clean
        run: npm run db:status

      - name: Tenant isolation (RLS) checks
        run: npm run test:tenant

      - name: Migration runner refuses edits, rolls back failures, guards CI
        run: npm run test:migrate

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@3.2.0 stop --workdir ci --no-backup
